<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Room</title>

    <link rel="stylesheet" href="edit-room.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <div>
                <h1>Edit Room</h1>
                <p>Update room information and save changes</p>
            </div>

            <button class="back-btn" type="button" id="backBtn">
                ← Back
            </button>

        </div>


        <div class="form-container">

            <form id="editRoomForm">

                <!-- Room Number -->
                <div class="form-group">

                    <label for="roomNumber">
                        Room Number
                    </label>

                    <input
                        type="text"
                        id="roomNumber"
                        name="roomNumber"
                        value="101"
                        required
                    >

                </div>


                <!-- Room Type -->
                <div class="form-group">

                    <label for="roomType">
                        Room Type
                    </label>

                    <select
                        id="roomType"
                        name="roomType"
                        required
                    >

                        <option value="">
                            Select Room Type
                        </option>

                        <option value="Standard">
                            Standard
                        </option>

                        <option value="Deluxe" selected>
                            Deluxe
                        </option>

                        <option value="Suite">
                            Suite
                        </option>

                    </select>

                </div>


                <!-- Price -->
                <div class="form-group">

                    <label for="price">
                        Price Per Night (Rs.)
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        value="5000"
                        min="1"
                        required
                    >

                </div>


                <!-- Maximum Guests -->
                <div class="form-group">

                    <label for="guests">
                        Maximum Guests
                    </label>

                    <input
                        type="number"
                        id="guests"
                        name="guests"
                        value="2"
                        min="1"
                        required
                    >

                </div>


                <!-- Room Status -->
                <div class="form-group">

                    <label for="status">
                        Room Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        required
                    >

                        <option value="Available" selected>
                            Available
                        </option>

                        <option value="Occupied">
                            Occupied
                        </option>

                        <option value="Maintenance">
                            Maintenance
                        </option>

                    </select>

                </div>


                <!-- Room Description -->
                <div class="form-group">

                    <label for="description">
                        Room Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Enter room description"
                    >Comfortable deluxe room with modern facilities.</textarea>

                </div>


                <!-- Buttons -->
                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                        id="saveBtn"
                    >
                        Save Changes
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="edit-room.js"></script>

</body>
</html>
