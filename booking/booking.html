
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking</title>

    <link rel="stylesheet" href="booking.css">
</head>
<body>

    <div class="booking-container">

        <!-- Header -->
        <div class="header">
            <h1>Hotel Booking</h1>
            <p>Make a New Room Reservation</p>
        </div>

        <!-- Customer Information -->
        <div class="section">
            <h2>Customer Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter customer name">
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Enter phone number">
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label>CNIC</label>
                    <input type="text" placeholder="Enter CNIC number">
                </div>

            </div>
        </div>

        <!-- Room Information -->
        <div class="section">
            <h2>Room Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Room Number</label>

                    <select>
                        <option value="">Select Room</option>
                        <option value="101">Room 101</option>
                        <option value="102">Room 102</option>
                        <option value="103">Room 103</option>
                        <option value="201">Room 201</option>
                        <option value="202">Room 202</option>
                        <option value="203">Room 203</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Room Type</label>

                    <select>
                        <option value="">Select Room Type</option>
                        <option value="single">Single Room</option>
                        <option value="double">Double Room</option>
                        <option value="deluxe">Deluxe Room</option>
                        <option value="suite">Suite</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Number of Guests</label>
                    <input type="number" min="1" placeholder="Enter guests">
                </div>

                <div class="form-group">
                    <label>Number of Rooms</label>
                    <input type="number" min="1" value="1">
                </div>

            </div>
        </div>

        <!-- Booking Dates -->
        <div class="section">
            <h2>Booking Dates</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Check In Date</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Check Out Date</label>
                    <input type="date">
                </div>

            </div>
        </div>

        <!-- Payment Information -->
        <div class="section">
            <h2>Payment Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Payment Method</label>

                    <select>
                        <option value="">Select Payment Method</option>
                        <option value="cash">Cash</option>
                        <option value="card">Card</option>
                        <option value="online">Online Payment</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Advance Payment</label>
                    <input type="number" placeholder="Enter advance amount">
                </div>

            </div>
        </div>

        <!-- Special Request -->
        <div class="section">
            <h2>Special Request</h2>

            <textarea
                placeholder="Enter any special request..."
                rows="5">
            </textarea>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button class="cancel-btn" type="reset">Cancel</button>
            <button class="book-btn" type="submit">Confirm Booking</button>
        </div>

    </div>

    <script src="booking.js"></script>

</body>
</html>
