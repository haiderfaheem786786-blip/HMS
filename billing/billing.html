
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Billing</title>

    <link rel="stylesheet" href="billing.css">
</head>
<body>

    <div class="billing-container">

        <!-- Header -->
        <div class="header">
            <h1>Hotel Billing</h1>
            <p>Generate Customer Bill</p>
        </div>

        <!-- Customer Information -->
        <div class="section">
            <h2>Customer Information</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" placeholder="Enter customer name">
                </div>

                <div class="form-group">
                    <label>Room Number</label>
                    <input type="text" placeholder="Enter room number">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Check In</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Check Out</label>
                    <input type="date">
                </div>
            </div>
        </div>

        <!-- Billing Details -->
        <div class="section">
            <h2>Billing Details</h2>

            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Room Charges</td>
                        <td>2 Nights</td>
                        <td>5000</td>
                        <td>10000</td>
                    </tr>

                    <tr>
                        <td>Food</td>
                        <td>2</td>
                        <td>1000</td>
                        <td>2000</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Bill Summary -->
        <div class="summary">
            <h2>Bill Summary</h2>

            <div class="summary-row">
                <span>Subtotal:</span>
                <span>Rs. 12000</span>
            </div>

            <div class="summary-row">
                <span>Tax:</span>
                <span>Rs. 1200</span>
            </div>

            <div class="summary-row total">
                <span>Grand Total:</span>
                <span>Rs. 13200</span>
            </div>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button class="generate-btn">Generate Bill</button>
            <button class="print-btn" onclick="window.print()">Print Bill</button>
        </div>

    </div>

    <script src="billing.js"></script>

</body>
</html>
